services:
  postgres:
    image: postgres:16-alpine
    container_name: price-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: price
      POSTGRES_USER: price
      POSTGRES_PASSWORD: price
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U price -d price"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
